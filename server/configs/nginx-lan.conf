# NGINX Configuration for TRC-V LAN Deployment
# ==============================================
# 
# This configuration is for local Ubuntu server deployment within a LAN.
# No SSL required for internal network (optional if needed).
#
# SETUP INSTRUCTIONS:
# 1. Copy this file: sudo cp nginx-lan.conf /etc/nginx/sites-available/trc-v
# 2. Edit and replace:
#    - 192.168.1.100 → your server's LAN IP address
#    - /path/to/trc-v → actual path to TRC-V project
# 3. Enable: sudo ln -s /etc/nginx/sites-available/trc-v /etc/nginx/sites-enabled/
# 4. Remove default: sudo rm /etc/nginx/sites-enabled/default (optional)
# 5. Test: sudo nginx -t
# 6. Reload: sudo systemctl reload nginx

# Upstream for Node.js backend (supports multiple instances for scaling)
upstream trcv_backend {
    server 127.0.0.1:5170;
    keepalive 32;
}

# Main server - serves both frontend and API
server {
    listen 80;
    server_name 192.168.1.100 trc-v.local localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # File upload size limit (for documents)
    client_max_body_size 15M;

    # ============================================
    # FRONTEND - React/Vite Dashboard
    # ============================================
    # Serve the built React frontend
    root /path/to/trc-v/dashboard/dist;
    index index.html;

    # SPA routing - all frontend routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ============================================
    # BACKEND API - Node.js Express
    # ============================================
    location /api/ {
        proxy_pass http://trcv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for API operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ============================================
    # WEBSOCKET - Socket.IO Real-time Updates
    # ============================================
    location /socket.io/ {
        proxy_pass http://trcv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================
    # HEALTH CHECK
    # ============================================
    location /health {
        proxy_pass http://trcv_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================
    # STATIC UPLOADS (if serving locally)
    # ============================================
    location /uploads/ {
        alias /path/to/trc-v/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # ============================================
    # GZIP COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml 
               application/javascript application/json
               image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
}

# ============================================
# OPTIONAL: HTTPS for LAN (Self-signed cert)
# ============================================
# If you need HTTPS within your LAN, generate a self-signed certificate:
#   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/trc-v.key \
#     -out /etc/ssl/certs/trc-v.crt
#
# Then uncomment and modify this block:
#
# server {
#     listen 443 ssl http2;
#     server_name 192.168.1.100 trc-v.local;
#
#     ssl_certificate /etc/ssl/certs/trc-v.crt;
#     ssl_certificate_key /etc/ssl/private/trc-v.key;
#
#     # ... copy all location blocks from above ...
# }
