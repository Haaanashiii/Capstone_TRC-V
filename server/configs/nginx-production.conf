# =============================================================================
# NGINX PRODUCTION CONFIGURATION FOR TRC-V GOVERNMENT WEBSITE
# =============================================================================
# 
# SECURITY LEVEL: HIGH (Government/Municipal System)
# 
# This configuration is optimized for:
# - Government security compliance
# - Multiple concurrent users (admins + operators)
# - WebSocket support for real-time updates
# - Protection against common attacks (DDoS, XSS, CSRF, etc.)
# - Performance for 10K+ documents
#
# =============================================================================
# 
# SETUP INSTRUCTIONS:
# ===================
# 
# 1. COPY THIS FILE:
#    sudo cp nginx-production.conf /etc/nginx/sites-available/trc-v
#
# 2. EDIT THE FILE - REPLACE THESE PLACEHOLDERS:
#    - YOUR_API_DOMAIN.com      → Your API domain (e.g., api.trc-v.gov.ph)
#    - YOUR_FRONTEND_DOMAIN.com → Your frontend domain (e.g., trc-v.gov.ph)
#    - /path/to/ssl/cert.pem    → Your SSL certificate path
#    - /path/to/ssl/key.pem     → Your SSL private key path
#    - /path/to/uploads/        → Your server uploads folder
#
# 3. ENABLE THE SITE:
#    sudo ln -s /etc/nginx/sites-available/trc-v /etc/nginx/sites-enabled/
#
# 4. TEST CONFIGURATION:
#    sudo nginx -t
#
# 5. GET SSL CERTIFICATE (Let's Encrypt - FREE):
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d YOUR_API_DOMAIN.com -d YOUR_FRONTEND_DOMAIN.com
#
# 6. RELOAD NGINX:
#    sudo systemctl reload nginx
#
# =============================================================================

# -----------------------------------------------------------------------------
# RATE LIMITING ZONES (Protection against brute force & DDoS)
# -----------------------------------------------------------------------------
# These MUST be placed in /etc/nginx/nginx.conf inside the http {} block
# OR create a separate file: /etc/nginx/conf.d/rate-limits.conf
# 
# Add these lines to nginx.conf or rate-limits.conf:
# -----------------------------------------------------------------------------
# # Rate limit zones for TRC-V
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
# limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# UPSTREAM CONFIGURATION (Load Balancing)
# -----------------------------------------------------------------------------
#
# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  OPTION A: PM2 CLUSTER MODE (RECOMMENDED - AUTOMATIC)                     ║
# ╠═══════════════════════════════════════════════════════════════════════════╣
# ║  PM2 handles load balancing internally. Just use:                         ║
# ║    pm2 start ecosystem.config.js --env production                         ║
# ║                                                                           ║
# ║  All instances share port 5170. Nginx only needs:                         ║
# ║    proxy_pass http://127.0.0.1:5170;                                      ║
# ║                                                                           ║
# ║  PM2 automatically distributes requests using round-robin.                ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  OPTION B: NGINX LOAD BALANCING (MANUAL - FOR ADVANCED CONTROL)           ║
# ╠═══════════════════════════════════════════════════════════════════════════╣
# ║  Use this if you want Nginx to control load balancing.                    ║
# ║  Uncomment the upstream block below AND change all proxy_pass to:         ║
# ║    proxy_pass http://trc_v_backend;                                       ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# upstream trc_v_backend {
#     # ALGORITHM OPTIONS (uncomment ONE):
#     
#     # 1. Least Connections - Send to least busy server (RECOMMENDED!)
#     #    Best when some requests are slow (PDF generation, large queries)
#     least_conn;
#     
#     # 2. IP Hash - Same user always goes to same server (for WebSocket)
#     #    Use this if you have WebSocket issues with least_conn
#     # ip_hash;
#     
#     # 3. Round Robin (default) - Rotate through servers
#     #    NOT recommended if some requests are slow
#     # (no directive needed, it's the default)
#     
#     # SERVER LIST - Add your Node.js instances:
#     # Same machine, different ports (run manually: PORT=5171 node index.js)
#     server 127.0.0.1:5170 weight=5;
#     server 127.0.0.1:5171 weight=5;
#     server 127.0.0.1:5172 weight=5;
#     server 127.0.0.1:5173 weight=5;
#     
#     # Different machine (uncomment if using 2 Ubuntu servers)
#     # server 192.168.1.10:5170 weight=5;  # Server #2 IP
#     # server 192.168.1.10:5171 weight=5;
#     
#     # Keep connections alive (improves performance)
#     keepalive 64;
# }
# -----------------------------------------------------------------------------

# =============================================================================
# HTTP → HTTPS REDIRECT (Force secure connections)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    
    # =========================================================================
    # EDIT THIS: Add your domains
    # =========================================================================
    server_name YOUR_API_DOMAIN.com YOUR_FRONTEND_DOMAIN.com;
    
    # Redirect ALL HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# =============================================================================
# MAIN HTTPS SERVER - API BACKEND
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # =========================================================================
    # EDIT THIS: Your API domain
    # Example: api.trc-v.gov.ph or api.yourdomain.com
    # =========================================================================
    server_name YOUR_API_DOMAIN.com;

    # =========================================================================
    # SSL CERTIFICATE CONFIGURATION
    # =========================================================================
    # EDIT THIS: Path to your SSL certificates
    # If using Let's Encrypt, certbot will auto-fill these
    # =========================================================================
    ssl_certificate /etc/letsencrypt/live/YOUR_API_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_API_DOMAIN.com/privkey.pem;
    
    # SSL Security Settings (A+ rating on SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling (faster SSL handshake)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # =========================================================================
    # SECURITY HEADERS (Government-grade protection)
    # =========================================================================
    
    # Prevent clickjacking attacks (SAMEORIGIN to allow PDF preview in iframes)
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Force HTTPS for 1 year (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (allows blob: for PDF preview in iframes)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' wss: https:; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    
    # Permissions Policy (disable unnecessary browser features)
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # Hide Nginx version
    server_tokens off;
    
    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # REQUEST SIZE LIMITS
    # =========================================================================
    client_max_body_size 15M;  # Max file upload size
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # =========================================================================
    # MAIN API PROXY
    # =========================================================================
    location / {
        # Rate limiting (30 requests/second per IP)
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;
        
        proxy_pass http://127.0.0.1:5170;
        proxy_http_version 1.1;
        
        # Headers for proper IP detection
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # =========================================================================
    # WEBSOCKET ENDPOINT (Socket.IO for real-time updates)
    # =========================================================================
    location /socket.io/ {
        # Less strict rate limiting for WebSocket
        limit_req zone=api_limit burst=100 nodelay;
        
        proxy_pass http://127.0.0.1:5170;
        proxy_http_version 1.1;
        
        # CRITICAL: WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Long timeout for persistent connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Disable buffering for real-time
        proxy_buffering off;
    }

    # =========================================================================
    # AUTHENTICATION ENDPOINTS (Strict rate limiting)
    # =========================================================================
    location ~ ^/auth/(login|register|forgot-password|reset-password) {
        # Very strict: 5 requests per minute per IP
        limit_req zone=auth_limit burst=3 nodelay;
        
        proxy_pass http://127.0.0.1:5170;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # FILE UPLOAD ENDPOINTS (Rate limited)
    # =========================================================================
    location ~ ^/api/(franchise-applications|franchise-information)/.*upload {
        limit_req zone=upload_limit burst=5 nodelay;
        
        client_max_body_size 15M;
        
        proxy_pass http://127.0.0.1:5170;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeout for uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # =========================================================================
    # HEALTH CHECK (No rate limiting, no logging)
    # =========================================================================
    location /health {
        proxy_pass http://127.0.0.1:5170/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =========================================================================
    # STATIC UPLOADS (Served directly by Nginx - faster)
    # =========================================================================
    # EDIT THIS: Path to your uploads folder
    # Example: /var/www/trc-v/server/uploads/
    # =========================================================================
    location /uploads/ {
        alias /path/to/uploads/;
        
        # Security: Only allow specific file types
        location ~* \.(jpg|jpeg|png|gif|pdf|doc|docx)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff";
        }
        
        # Block everything else
        location ~* \.(php|exe|sh|bat|js|html)$ {
            deny all;
        }
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # =========================================================================
    # GZIP COMPRESSION (Faster page loads)
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss;
    gzip_disable "MSIE [1-6]\.";

    # =========================================================================
    # ERROR PAGES
    # =========================================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # =========================================================================
    # LOGGING
    # =========================================================================
    access_log /var/log/nginx/trc-v-api-access.log;
    error_log /var/log/nginx/trc-v-api-error.log warn;
}

