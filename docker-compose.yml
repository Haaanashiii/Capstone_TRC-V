# TRC-V Docker Compose - Enterprise Scale Configuration
# ========================================================
# 
# SCALING GUIDE:
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ Scale Level   │ Backend Containers │ PM2 Workers │ Total Capacity      │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ Development   │ 1                  │ 1           │ ~100 concurrent     │
# │ Small Office  │ 1                  │ 2           │ ~500 concurrent     │
# │ City-wide     │ 2                  │ 2           │ ~2000 concurrent    │
# │ Province      │ 4                  │ 4           │ ~8000 concurrent    │
# │ Enterprise    │ Docker Swarm/K8s   │ max         │ Auto-scale          │
# └─────────────────────────────────────────────────────────────────────────┘
#
# USAGE:
#   Development:     docker-compose up -d
#   Production:      docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Scale Backend:   docker-compose up -d --scale backend=3
#   View Logs:       docker-compose logs -f backend
#   Monitor:         docker stats
#
# ENVIRONMENT VARIABLES (set in .env file):
#   PM2_INSTANCES=2        # Workers per container (2 default, 'max' for all CPUs)
#   NODE_ENV=production    # production | development | staging
#   MONGO_REPLICAS=3       # For MongoDB replica set (enterprise)
#

name: trc-v

services:
  # ===========================================
  # FRONTEND DASHBOARD (React + Vite)
  # ===========================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost}
        - VITE_CLIENT_REDIRECT=${VITE_CLIENT_REDIRECT:-http://localhost:3000}
        - NODE_ENV=${NODE_ENV:-production}
    container_name: trc-v-dashboard
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - trcv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================
  # BACKEND API (Node.js + PM2 Cluster)
  # ===========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    # Remove container_name to allow scaling
    # container_name: trc-v-backend
    restart: always
    ports:
      - "5170:5170"
    environment:
      # Core settings
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5170}
      - DOCKER_ENV=true
      
      # PM2 Cluster settings (enterprise scaling)
      - PM2_INSTANCES=${PM2_INSTANCES:-2}
      - PM2_MAX_MEMORY=${PM2_MAX_MEMORY:-512M}
      
      # Database
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/trcv}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # Security
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      
      # CORS
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      
      # Debug
      - DEBUG=${DEBUG:-false}
      - SOCKET_LOG_LEVEL=${SOCKET_LOG_LEVEL:-info}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trcv-network
    volumes:
      # Persist uploads and backups
      - backend-uploads:/app/uploads
      - backend-backups:/app/backups
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5170/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    # Enterprise resource limits
    deploy:
      # Uncomment for Docker Swarm mode
      # mode: replicated
      # replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}/{{.ID}}"

  # ===========================================
  # MONGODB DATABASE
  # ===========================================
  mongo:
    image: mongo:7
    container_name: trc-v-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      # Uncomment for authentication (production)
      # - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      # - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:-changeme}
      - MONGO_INITDB_DATABASE=trcv
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      # Uncomment for initialization scripts
      # - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - trcv-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Command for better performance
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5", "--setParameter", "diagnosticDataCollectionEnabled=false"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ===========================================
  # REDIS (Session Store + Socket.IO Adapter)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: trc-v-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - trcv-network
    # Redis configuration for enterprise
    command: >
      sh -c "if [ -n '${REDIS_PASSWORD}' ]; then
        redis-server 
        --requirepass ${REDIS_PASSWORD} 
        --appendonly yes 
        --maxmemory 512mb 
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 300
        --timeout 0
        --tcp-backlog 511;
      else
        redis-server 
        --appendonly yes 
        --maxmemory 512mb 
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 300
        --timeout 0
        --tcp-backlog 511;
      fi"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "if [ -n \"${REDIS_PASSWORD}\" ]; then redis-cli -a \"${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================
  # NGINX (Reverse Proxy + Load Balancer)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: trc-v-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Nginx cache directory
      - nginx-cache:/var/cache/nginx
      # SSL certificates (uncomment for production)
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks:
      - trcv-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# ===========================================
# VOLUMES (Persistent Data)
# ===========================================
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  backend-uploads:
    driver: local
  backend-backups:
    driver: local
  backend-logs:
    driver: local
  nginx-cache:
    driver: local

# ===========================================
# NETWORKS
# ===========================================
networks:
  trcv-network:
    driver: bridge
    # For Docker Swarm, use overlay:
    # driver: overlay
    # attachable: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
