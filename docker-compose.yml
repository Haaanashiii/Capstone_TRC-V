# TRC-V Docker Compose - Scalable Configuration
# ================================================
# 
# USAGE:
#   Development:  docker-compose up -d
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Scale:        docker-compose up -d --scale backend=3
#
# SCALING GUIDE:
#   Small (1 office):      1 backend container, PM2 handles clustering
#   Medium (city-wide):    2-4 backend containers
#   Large (province):      Use Docker Swarm or Kubernetes
#

name: trc-v

services:
  # ===========================================
  # FRONTEND DASHBOARD (React + Vite)
  # ===========================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost}
        - VITE_CLIENT_REDIRECT=${VITE_CLIENT_REDIRECT:-http://localhost:3000}
        - NODE_ENV=${NODE_ENV:-production}
    container_name: trc-v-dashboard
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - trcv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ===========================================
  # BACKEND API (Node.js + PM2)
  # ===========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trc-v-backend
    restart: always
    ports:
      - "5170:5170"
    environment:
      # These override values from env_file if both exist
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5170}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/trcv}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - DEBUG=${DEBUG:-false}
    env_file:
      - .env  # Reads from project root .env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - trcv-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5170/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ===========================================
  # MONGODB DATABASE
  # ===========================================
  mongo:
    image: mongo:7
    container_name: trc-v-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - trcv-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===========================================
  # REDIS (Socket.IO Adapter + Session Store)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: trc-v-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - trcv-network
    # Conditional password protection - only if REDIS_PASSWORD is set in .env
    command: >
      sh -c "if [ -n '$REDIS_PASSWORD' ]; then
        redis-server --requirepass $REDIS_PASSWORD --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
      fi"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ===========================================
  # NGINX (Reverse Proxy + Load Balancer)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: trc-v-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Uncomment for SSL:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - trcv-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ===========================================
# VOLUMES (Persistent Data)
# ===========================================
volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local

# ===========================================
# NETWORKS
# ===========================================
networks:
  trcv-network:
    driver: bridge
