# TRC-V Nginx Configuration - Enterprise Scale
# ===============================================
# Scalable reverse proxy with load balancing, caching, and security hardening
#
# SCALING GUIDE:
# ┌────────────────────────────────────────────────────────────────────────┐
# │ Level         │ worker_processes │ worker_connections │ Upstream IPs   │
# ├────────────────────────────────────────────────────────────────────────┤
# │ Single Server │ auto             │ 1024               │ backend:5170   │
# │ Multi-Server  │ auto             │ 4096               │ Add more IPs   │
# │ Enterprise    │ auto             │ 8192               │ Docker Swarm   │
# └────────────────────────────────────────────────────────────────────────┘

# Auto-detect CPU cores (use all available)
worker_processes auto;

# Increase worker limit for enterprise
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Connections per worker (multiply by worker_processes for total)
    worker_connections 4096;
    
    # Use efficient event model
    use epoll;
    
    # Accept multiple connections at once
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ═══════════════════════════════════════════════════════════════════════
    # LOGGING (Enterprise Format with request ID for tracing)
    # ═══════════════════════════════════════════════════════════════════════
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # JSON format for log aggregation (ELK, Datadog, etc.)
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

    access_log /var/log/nginx/access.log main;

    # ═══════════════════════════════════════════════════════════════════════
    # PERFORMANCE OPTIMIZATIONS
    # ═══════════════════════════════════════════════════════════════════════
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Keepalive connections
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # Connection timeout settings
    client_body_timeout 120s;           # Increased for large uploads
    client_header_timeout 30s;
    send_timeout 120s;                  # Increased for large responses
    
    # Hash table sizes
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;
    
    # Buffer sizes (optimized for API responses and large JSON payloads)
    client_body_buffer_size 256k;       # Increased for backup uploads
    client_max_body_size 100M;          # Increased for large backup files
    large_client_header_buffers 4 32k;

    # ═══════════════════════════════════════════════════════════════════════
    # GZIP COMPRESSION (Reduce bandwidth)
    # ═══════════════════════════════════════════════════════════════════════
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript
        application/json 
        application/javascript 
        application/xml 
        application/xml+rss 
        application/x-javascript
        application/vnd.api+json
        image/svg+xml;

    # ═══════════════════════════════════════════════════════════════════════
    # RATE LIMITING ZONES (DDoS Protection)
    # ═══════════════════════════════════════════════════════════════════════
    # Zone sizes: 10m ≈ 160,000 IPs, 20m ≈ 320,000 IPs
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:20m rate=50r/s;
    
    # Connection limiting (prevent connection flooding)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn_status 429;
    limit_req_status 429;

    # ═══════════════════════════════════════════════════════════════════════
    # PROXY CACHE (Reduce backend load)
    # ═══════════════════════════════════════════════════════════════════════
    proxy_cache_path /var/cache/nginx/api 
        levels=1:2 
        keys_zone=api_cache:10m 
        max_size=100m 
        inactive=60m 
        use_temp_path=off;
    
    # Cache status header (for debugging)
    add_header X-Cache-Status $upstream_cache_status;

    # ═══════════════════════════════════════════════════════════════════════
    # UPSTREAM: Backend API Servers (Load Balancing)
    # ═══════════════════════════════════════════════════════════════════════
    # SCALING: Add more backend servers here for horizontal scaling
    # 
    # Load Balancing Methods:
    #   - least_conn: Best for varying request times (recommended)
    #   - ip_hash: Session persistence (use if not using Redis sessions)
    #   - round_robin: Default, simple rotation
    #
    upstream backend_servers {
        # Load balancing algorithm
        least_conn;
        
        # Primary backend (Docker service name)
        server backend:5170 weight=1 max_fails=3 fail_timeout=30s;
        
        # ═══════════════════════════════════════════════════════════════
        # SCALING: Add more backends for horizontal scaling
        # ═══════════════════════════════════════════════════════════════
        # server backend-2:5170 weight=1 max_fails=3 fail_timeout=30s;
        # server backend-3:5170 weight=1 max_fails=3 fail_timeout=30s;
        #
        # For external servers (different machines):
        # server 192.168.1.101:5170 weight=1 max_fails=3 fail_timeout=30s;
        # server 192.168.1.102:5170 weight=1 max_fails=3 fail_timeout=30s;
        #
        # Backup server (only used when all others fail):
        # server backup.example.com:5170 backup;
        
        # Keep connections alive to backends (reduces connection overhead)
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ═══════════════════════════════════════════════════════════════════════
    # MAIN SERVER BLOCK
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;
        
        # Connection limit per IP
        limit_conn conn_limit 50;

        # ═══════════════════════════════════════════════════════════════════
        # CORS Configuration - Dynamic origin handling
        # ═══════════════════════════════════════════════════════════════════
        set $cors_origin "";
        set $cors_cred "";
        
        # Allow localhost and LAN IPs
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]+\.[0-9]+)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
            set $cors_cred "true";
        }
        
        # Allow your production domain (uncomment and modify)
        # if ($http_origin ~* "^https?://(yourdomain\.com|app\.yourdomain\.com)$") {
        #     set $cors_origin $http_origin;
        #     set $cors_cred "true";
        # }

        # ═══════════════════════════════════════════════════════════════════
        # SECURITY HEADERS
        # ═══════════════════════════════════════════════════════════════════
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $request_id always;
        
        # Content Security Policy (uncomment for production)
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # ═══════════════════════════════════════════════════════════════════
        # FRONTEND (Static Files)
        # ═══════════════════════════════════════════════════════════════════
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # General rate limit
            limit_req zone=general_limit burst=100 nodelay;

            # PWA Service Worker - no cache
            location = /sw.js {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }

            # PWA Manifest
            location = /manifest.webmanifest {
                add_header Cache-Control "no-cache";
                types { application/manifest+json webmanifest; }
            }

            # Static assets - aggressive caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ═══════════════════════════════════════════════════════════════════
        # HEALTH CHECKS
        # ═══════════════════════════════════════════════════════════════════
        # Nginx-only health check (for Docker/K8s liveness probes)
        location = /nginx-health {
            access_log off;
            return 200 'nginx ok';
            add_header Content-Type text/plain;
        }

        # Backend health check (for full system readiness)
        location = /health {
            proxy_pass http://backend_servers/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }
        
        # Detailed backend status (protected endpoint)
        location = /api/status {
            # Uncomment to restrict to internal IPs only
            # allow 192.168.0.0/16;
            # allow 10.0.0.0/8;
            # deny all;
            
            proxy_pass http://backend_servers/api/status;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ═══════════════════════════════════════════════════════════════════
        # API ROUTES - Proxy to Backend with optimizations
        # ═══════════════════════════════════════════════════════════════════
        location /api {
            # Handle preflight requests
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_cred always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Rate limiting
            limit_req zone=api_limit burst=50 nodelay;
            
            # Proxy settings
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering (improves performance)
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 24k;
            
            # Hide backend CORS headers (prevent duplicates)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            
            # Add CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_cred always;
            add_header X-Request-ID $request_id always;
        }

        # ═══════════════════════════════════════════════════════════════════
        # AUTH ROUTES (Stricter rate limit)
        # ═══════════════════════════════════════════════════════════════════
        location /auth {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_cred always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Strict rate limit for auth endpoints
            limit_req zone=auth_limit burst=10 nodelay;
            
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_cred always;
        }

        # ═══════════════════════════════════════════════════════════════════
        # FILE UPLOAD ROUTES (Special handling)
        # ═══════════════════════════════════════════════════════════════════
        location ~ ^/(api/upload|api/files|api/backup) {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_cred always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
                add_header Access-Control-Max-Age 86400;
                return 204;
            }

            # Rate limit for uploads
            limit_req zone=upload_limit burst=5 nodelay;
            
            # Larger body size for uploads
            client_max_body_size 100M;
            client_body_buffer_size 256k;
            
            # Extended timeouts for large file processing and restore operations
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            send_timeout 600s;
            
            # Disable request buffering for streaming uploads
            proxy_request_buffering off;
            
            # Enable response buffering with large buffers for backup responses
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;
            
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_cred always;
        }

        # ═══════════════════════════════════════════════════════════════════
        # QR VERIFICATION
        # ═══════════════════════════════════════════════════════════════════
        location /qr {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_cred always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            limit_req zone=api_limit burst=30 nodelay;
            
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_cred always;
        }

        # ═══════════════════════════════════════════════════════════════════
        # OTHER ROUTES (Users, Admins, Announcements)
        # ═══════════════════════════════════════════════════════════════════
        location ~ ^/(users|admins|announcements) {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_cred always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            limit_req zone=api_limit burst=30 nodelay;
            
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_cred always;
        }

        # ═══════════════════════════════════════════════════════════════════
        # WEBSOCKET (Socket.IO) - Critical for real-time features
        # ═══════════════════════════════════════════════════════════════════
        location /socket.io/ {
            proxy_pass http://backend_servers/socket.io/;
            proxy_http_version 1.1;
            
            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Long timeouts for WebSocket
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            
            # No buffering for WebSocket
            proxy_buffering off;
            
            # Disable caching for WebSocket
            proxy_cache off;
        }

        # ═══════════════════════════════════════════════════════════════════
        # ERROR PAGES
        # ═══════════════════════════════════════════════════════════════════
        error_page 429 /429.html;
        location = /429.html {
            internal;
            return 429 '{"error": "Too Many Requests", "message": "Please slow down and try again later"}';
            add_header Content-Type application/json;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # ═══════════════════════════════════════════════════════════════════════
    # HTTPS SERVER (Uncomment for production with SSL)
    # ═══════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name api.yourdomain.com;
    #     
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #     
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #     
    #     # Include all location blocks from above...
    # }
}
