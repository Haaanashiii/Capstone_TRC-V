<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/TRC-vLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Content Security Policy - XSS Protection -->
    <!-- Note: http://localhost:* needed for local Docker development (images from API) -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*;
      connect-src 'self' https: wss: ws: http://localhost:* ws://localhost:* http://127.0.0.1:*;
      frame-src 'self' blob: https://accounts.google.com;
      object-src 'self' blob:;
      base-uri 'self';
      form-action 'self';
    ">
    
    <!-- Security headers (X-Frame-Options, X-Content-Type-Options) are set by nginx as HTTP headers -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0A356B" />
    <meta name="description" content="TRC-V - Tricycle Verification System for franchises, operators, and public" />
    
    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TRC-V" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    
    <!-- Microsoft PWA Meta Tags -->
    <meta name="msapplication-TileColor" content="#0A356B" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <title>TRC-V</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
