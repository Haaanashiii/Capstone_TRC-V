# Redis Configuration for TRC-V
# This file is mounted into the Redis container

# Persistence
appendonly yes
save 900 1
save 300 10
save 60 10000

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Network
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Security - Password will be set via environment variable
# requirepass is set at runtime via command line
