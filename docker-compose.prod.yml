# TRC-V Docker Compose - Production & Enterprise Overrides
# ==========================================================
# 
# USAGE:
#   Single Server:    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Multi-Backend:    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale backend=3
#   Docker Swarm:     docker stack deploy -c docker-compose.yml -c docker-compose.prod.yml trc-v
#
# REQUIREMENTS:
#   - Set all environment variables in .env file
#   - Configure SSL certificates in nginx/ssl/
#   - Set strong passwords for MongoDB and Redis
#
# SCALING (set via environment or command line):
#   PM2_INSTANCES=4      # Workers per container
#   --scale backend=3    # Docker containers
#   Total: 4 x 3 = 12 Node.js workers
#

version: '3.8'

services:
  # ===========================================
  # BACKEND - Production Configuration
  # ===========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    environment:
      - NODE_ENV=production
      # Enterprise scaling
      - PM2_INSTANCES=${PM2_INSTANCES:-4}
      - PM2_MAX_MEMORY=${PM2_MAX_MEMORY:-1G}
      # Performance
      - UV_THREADPOOL_SIZE=16
    # Production logging with rotation
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        tag: "{{.Name}}/{{.ID}}"
        compress: "true"
    # Scale for production
    deploy:
      mode: replicated
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 300s
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s

  # ===========================================
  # MONGODB - Production Configuration
  # ===========================================
  mongo:
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is required in production}
      - MONGO_INITDB_DATABASE=trcv
    # Enable authentication and optimize for production
    command: 
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "1"
      - --setParameter
      - diagnosticDataCollectionEnabled=false
      - --setParameter
      - maxIndexBuildMemoryUsageMegabytes=200
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================
  # REDIS - Production Configuration
  # ===========================================
  redis:
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --tcp-backlog 511
      --save 900 1
      --save 300 10
      --save 60 10000
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ===========================================
  # NGINX - Production Configuration
  # ===========================================
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      # Let's Encrypt (optional)
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ===========================================
  # DASHBOARD - Production Configuration
  # ===========================================
  dashboard:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx-cache:
    driver: local
