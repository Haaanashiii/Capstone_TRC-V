# Dependabot configuration for automatic dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Frontend (dashboard) - npm dependencies
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Manila"
    # REDUCED: Limit to 2 open PRs to avoid clutter
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "frontend"
    # Group ALL updates together into a SINGLE PR
    groups:
      all-dashboard-deps:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Backend (server) - npm dependencies
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Manila"
    # REDUCED: Limit to 2 open PRs
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    # Group ALL updates together into a SINGLE PR
    groups:
      all-server-deps:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Docker dependencies - monthly only (less frequent)
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
